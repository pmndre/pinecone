name: Release

# Every push to main is a release, as in pine: its tests are run, it gets the next version, a tag and a
# GitHub release, and Pinecone.app is attached to it as a disk image, one app for both kinds of Mac
# (Pinecone-<version>.dmg).
#
# The version follows from the commits since the last release: the patch number goes up, unless one of
# them says [minor] or [major] in its subject, which raises that number instead. The first release is
# the version in menubar/Info.plist. A push whose last commit says [skip release] in its subject releases
# nothing. Only the subject counts, so that a message can name these words without doing what they say.
#
# The app is signed with a Developer ID, notarised by Apple and checked the way another Mac checks it
# before it is uploaded (menubar/pack.sh). That needs the five secrets pine's release uses, in an
# environment named "release" that is restricted to the branch main, so that no other branch can use them:
#   CSC_LINK            the "Developer ID Application" certificate with its key, a .p12 file, as base64
#   CSC_KEY_PASSWORD    the password of that file
#   APPLE_API_KEY       an App Store Connect API key: the text of its .p8 file
#   APPLE_API_KEY_ID    that key's ID
#   APPLE_API_ISSUER    the issuer ID shown above the keys
# Without them the app is not built, and the job says so: an app that is not signed and notarised is one
# macOS refuses to open, so none is handed out. With only some of them the job fails.
#
# The app of a release can be built again by hand, without making a new release: Actions > Release > Run
# workflow, from main, with the release's version (gh workflow run release.yml --ref main -f version=0.1.0).
# It is built from that release's tag and attached to that release, in place of what is there.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Build the app again for this release and attach it (a version that has a release, like 0.1.0)
        required: true

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    # The scheduler is made for macOS (memory, the GPU limit), so its tests run there.
    runs-on: macos-15
    # One at a time: the version is worked out from the tags there are.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # the release and its tag
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # the commits and tags since the last release decide the version
          persist-credentials: false
      - id: version
        name: The next version
        run: |
          if git log -1 --format=%s | grep -qi '\[skip release\]'; then
            echo "::notice::The last commit says [skip release]; nothing is released."
            exit 0
          fi
          last=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$last" ]; then
            version=$(plutil -extract CFBundleShortVersionString raw menubar/Info.plist)
            why="the first release"
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            messages=$(git log --format=%s "$last..HEAD")
            if printf '%s' "$messages" | grep -qi '\[major\]'; then major=$((major + 1)); minor=0; patch=0; why="a commit says [major]"
            elif printf '%s' "$messages" | grep -qi '\[minor\]'; then minor=$((minor + 1)); patch=0; why="a commit says [minor]"
            else patch=$((patch + 1)); why="the patch number"; fi
            version="$major.$minor.$patch"
          fi
          echo "${last:-no release yet} -> $version ($why)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.version
        name: Tests
        # As docs/operations.md runs them: run.py against a scheduler with the stand-in servers, then the
        # tests that start a scheduler of their own on the same port, then the media tools.
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt
          export PINECONE_HOME="$RUNNER_TEMP/pinecone-home"
          mkdir -p "$PINECONE_HOME"
          .venv/bin/python scheduler/scheduler.py scheduler/tests/config.json > "$RUNNER_TEMP/scheduler.log" 2>&1 &
          scheduler=$!
          for i in $(seq 30); do curl -sf http://127.0.0.1:18080/health >/dev/null && break; sleep 1; done
          status=0
          .venv/bin/python scheduler/tests/run.py || status=1
          kill "$scheduler"; wait "$scheduler" 2>/dev/null || true
          for test in reload cache settings; do .venv/bin/python "scheduler/tests/$test.py" || status=1; done
          .venv/bin/python media_mcp/tests/tools.py || status=1
          if [ "$status" -ne 0 ]; then echo "--- scheduler log"; cat "$RUNNER_TEMP/scheduler.log"; fi
          exit "$status"
      - if: steps.version.outputs.version
        name: The release
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}

  # The app of a release: built, signed, notarised and checked on a Mac, then attached to the release.
  app:
    needs: release
    # After a release from main, or by hand for a release there already is (the release job is then skipped).
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.outputs.version != '')
    runs-on: macos-15
    environment: release
    permissions:
      contents: write # the disk image goes to the release
    env:
      VERSION: ${{ inputs.version || needs.release.outputs.version }}
    steps:
      - id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_TEXT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$VERSION\" is not the version of a release (like 0.1.0)."
            exit 1
          fi
          missing=""
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_TEXT APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing ${name%_TEXT}"; fi
          done
          if [ "$(echo $missing | wc -w)" -eq 5 ]; then
            echo "::notice::Pinecone.app was not built: the environment \"release\" has no signing secrets yet (see the top of release.yml)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "::error::Pinecone.app cannot be signed and notarised: these secrets are missing in the environment \"release\":$missing"
            exit 1
          else
            printf '%s' "$APPLE_API_KEY_TEXT" > "$RUNNER_TEMP/app-store-connect.p8"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # By hand: the release's own commit.
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.sha }}
          persist-credentials: false
      - if: steps.signing.outputs.ready == 'true'
        name: Use the newest Xcode on the runner
        # The app needs the macOS 15 SDK, and the universal build Xcode's build system.
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          sdk="$(DEVELOPER_DIR="$xcode/Contents/Developer" xcrun --sdk macosx --show-sdk-version)"
          echo "$xcode, macOS SDK $sdk"
          if [ "${sdk%%.*}" -lt 15 ]; then
            echo "::error::The newest Xcode on this runner has the macOS $sdk SDK; Pinecone needs 15 or newer."
            exit 1
          fi
      - if: steps.signing.outputs.ready == 'true'
        name: Pack, sign and notarise
        run: menubar/pack.sh "$VERSION"
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/app-store-connect.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - if: steps.signing.outputs.ready == 'true'
        run: gh release upload "v$VERSION" --clobber "menubar/build/Pinecone-$VERSION.dmg"
        env:
          GH_TOKEN: ${{ github.token }}
      - if: always()
        run: rm -f "$RUNNER_TEMP/app-store-connect.p8"
